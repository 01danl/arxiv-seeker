name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: black --check arxiv_seeker tests
      - run: isort --check-only arxiv_seeker tests
      - run: flake8 arxiv_seeker --max-line-length=110
      - run: pytest --cov=arxiv_seeker --cov-report=xml
